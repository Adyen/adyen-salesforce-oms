<template>
    <lightning-card title="Adyen OMS Configuration" icon-name="custom:custom63">
        <div slot="actions">
            <lightning-button 
                variant="neutral" 
                label="Previous Step" 
                icon-name="utility:back"
                icon-position="left"
                onclick={handlePreviousStep}
                disabled={isFirstStep}
                class="slds-m-right_x-small">
            </lightning-button>
            <lightning-button 
                variant="neutral" 
                label="Next Step" 
                icon-name="utility:forward"
                icon-position="right"
                onclick={handleNextStep}
                disabled={isLastStep}
                class="slds-m-right_x-small">
            </lightning-button>
        </div>
        
        <div class="slds-p-around_medium">
            <div class="slds-path">
                <div class="slds-grid slds-path__track">
                    <div class="slds-grid slds-path__scroller-container">
                        <div class="slds-path__scroller">
                            <div class="slds-path__scroller_inner">
                                <ul class="slds-path__nav" role="listbox" aria-orientation="horizontal">
                                  
                                    <li class={paymentGatewayStepClass} role="presentation">
                                        <a class="slds-path__link" data-step="paymentGateway" onclick={handleStepClick} role="option" tabindex="0">
                                            <span class="slds-path__stage">
                                                <lightning-icon icon-name="utility:check" size="x-small" variant="inverse"></lightning-icon>
                                            </span>
                                            <span class="slds-path__title">Payment Gateway</span>
                                        </a>
                                    </li>
                                    
                                 
                                    <li class={namedCredentialStepClass} role="presentation">
                                        <a class="slds-path__link" data-step="namedCredential" onclick={handleStepClick} role="option" tabindex="-1">
                                            <span class="slds-path__stage">
                                                <lightning-icon icon-name="utility:check" size="x-small" variant="inverse"></lightning-icon>
                                            </span>
                                            <span class="slds-path__title">Named Credentials</span>
                                        </a>
                                    </li>
                                    
                               
                                    <li class={siteURLStepClass} role="presentation">
                                        <a class="slds-path__link" data-step="siteURL" onclick={handleStepClick} role="option" tabindex="-1">
                                            <span class="slds-path__stage">
                                                <lightning-icon icon-name="utility:check" size="x-small" variant="inverse"></lightning-icon>
                                            </span>
                                            <span class="slds-path__title">Site URL Setup</span>
                                        </a>
                                    </li>
                                    
                                   
                                    <li class={merchantAccountStepClass} role="presentation">
                                        <a class="slds-path__link" data-step="merchantAccount" onclick={handleStepClick} role="option" tabindex="-1">
                                            <span class="slds-path__stage">
                                                <lightning-icon icon-name="utility:check" size="x-small" variant="inverse"></lightning-icon>
                                            </span>
                                            <span class="slds-path__title">Merchant Account</span>
                                        </a>
                                    </li>
                                    
                                    <li class={webhookSetupStepClass} role="presentation">
                                        <a class="slds-path__link" data-step="webhookSetup" onclick={handleStepClick} role="option" tabindex="-1">
                                            <span class="slds-path__stage">
                                                <lightning-icon icon-name="utility:check" size="x-small" variant="inverse"></lightning-icon>
                                            </span>
                                            <span class="slds-path__title">Webhook Setup</span>
                                        </a>
                                    </li>
                                    
                                    <li class={pageLayoutSetupStepClass} role="presentation">
                                        <a class="slds-path__link" data-step="pageLayoutSetup" onclick={handleStepClick} role="option" tabindex="-1">
                                            <span class="slds-path__stage">
                                                <lightning-icon icon-name="utility:check" size="x-small" variant="inverse"></lightning-icon>
                                            </span>
                                            <span class="slds-path__title">Page Layout Setup</span>
                                        </a>
                                    </li>
                                    
                                    <li class={permissionSetupStepClass} role="presentation">
                                        <a class="slds-path__link" data-step="permissionSetup" onclick={handleStepClick} role="option" tabindex="-1">
                                            <span class="slds-path__stage">
                                                <lightning-icon icon-name="utility:check" size="x-small" variant="inverse"></lightning-icon>
                                            </span>
                                            <span class="slds-path__title">Permission Setup</span>
                                        </a>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="slds-m-top_large">
                <template if:true={isPaymentGatewayStep}>
                    <c-adyen-config-page-payment-gateway 
                        onstepcomplete={handleStepComplete}>
                    </c-adyen-config-page-payment-gateway>
                </template>
                
                <template if:true={isNamedCredentialStep}>
                    <c-adyen-config-page-named-credential>
                    </c-adyen-config-page-named-credential>
                </template>
                
                <template if:true={isSiteURLStep}>
                    <c-adyen-config-page-site-endpoint>
                    </c-adyen-config-page-site-endpoint>
                </template>
                
                <template if:true={isMerchantAccountStep}>
                    <c-adyen-config-page-merchant-account>
                    </c-adyen-config-page-merchant-account>
                </template>

                <template if:true={isWebhookSetupStep}>
                    <c-adyen-config-page-webhook-setup>
                    </c-adyen-config-page-webhook-setup>
                </template>

                <template if:true={isPageLayoutSetupStep}>
                    <c-adyen-config-page-layout-setup>
                    </c-adyen-config-page-layout-setup>
                </template>

                <template if:true={isPermissionSetupStep}>
                    <c-adyen-config-page-permission-setup>
                    </c-adyen-config-page-permission-setup>
                </template>
            </div>
        </div>
    </lightning-card>
</template>
