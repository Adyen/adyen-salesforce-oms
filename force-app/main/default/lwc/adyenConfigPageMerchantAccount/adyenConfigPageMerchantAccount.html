<template>
    <div class="slds-grid slds-gutters">
        <div class="slds-col slds-size_1-of-2">
            <div class="slds-box slds-box_x-small slds-m-bottom_medium slds-is-relative">
                <h2 class="slds-text-heading_medium slds-m-bottom_medium">Account Setup</h2>
                
                <template if:true={isLoading}>
                    <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
                </template>
                
                <div class="slds-box slds-is-relative" style="min-height: 350px; max-height: 350px;">
                    <div class="slds-m-bottom_large">
                        <div class="slds-media slds-media_center slds-p-bottom_medium slds-border_bottom">
                            <div class="slds-media__figure">
                                <span class="slds-icon_container slds-icon-standard-account">
                                    <lightning-icon icon-name="standard:account" size="small"></lightning-icon>
                                </span>
                            </div>
                            <div class="slds-media__body">
                                <div class="slds-text-heading_small slds-text-title_bold">Adyen Account Setup</div>
                                <div class="slds-text-body_small">{headerDescription}</div>
                            </div>
                        </div>
                        
                        <template if:true={showChoiceScreen}>
                            <div class="slds-p-around_medium slds-m-top_medium">
                                <h3 class="slds-text-heading_small slds-m-bottom_medium">Select the account type for webhook configuration</h3>
                                
                                <div class="slds-form-element slds-m-bottom_large">
                                    <lightning-radio-group
                                        name="setupType"
                                        label=""
                                        options={setupTypeOptions}
                                        value={selectedSetupType}
                                        onchange={handleSetupTypeChange}
                                        type="radio">
                                    </lightning-radio-group>
                                </div>
                                
                                <div class="slds-grid slds-grid_align-end">
                                    <lightning-button 
                                        variant="brand" 
                                        label="Continue" 
                                        onclick={handleContinueWithChoice} 
                                        disabled={isContinueDisabled}>
                                    </lightning-button>
                                </div>
                            </div>
                        </template>
                        
                        <template if:true={showCompanyConfirmation}>
                            <div class="slds-p-around_medium slds-m-top_medium">
                                <div class="slds-box slds-theme_success slds-m-bottom_medium">
                                    <div class="slds-grid slds-grid_vertical-align-center">
                                        <div class="slds-col slds-size_12-of-12">
                                            <p class="slds-text-body_regular">
                                                <strong>Company:</strong> {companyName}
                                            </p>
                                        </div>
                                    </div>
                                </div>
                                
                                <p class="slds-m-bottom_medium slds-text-body_regular">
                                    You have chosen to set up webhooks at the company account level. 
                                    Click "Continue to Webhook Setup" to proceed to the next step where webhooks will be configured for your entire company.
                                </p>
                                
                                <div class="slds-grid slds-grid_align-spread">
                                    <lightning-button 
                                        variant="neutral" 
                                        label="Back" 
                                        onclick={handleBackToChoice}>
                                    </lightning-button>
                                    <lightning-button 
                                        variant="brand" 
                                        label="Continue to Webhook Setup" 
                                        onclick={handleContinueToWebhook}>
                                    </lightning-button>
                                </div>
                            </div>
                        </template>

                        <template if:true={showMerchantFlow}>
                            <template if:true={apiError}>
                                <div class="slds-p-around_medium slds-m-top_medium">
                                    <div class="slds-box slds-theme_error">
                                        <div class="slds-grid slds-grid_vertical-align-center">
                                            <div class="slds-col slds-size_11-of-12">
                                                <p class="slds-text-body_regular">{apiError}</p>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="slds-grid slds-grid_align-spread slds-m-top_medium">
                                        <lightning-button 
                                            variant="neutral" 
                                            label="Back" 
                                            onclick={handleBackToChoice}
                                            disabled={isLoading}>
                                        </lightning-button>
                                        <lightning-button 
                                            variant="neutral" 
                                            label="Retry" 
                                            icon-name="utility:refresh"
                                            onclick={handleRetry} 
                                            disabled={isLoading}>
                                        </lightning-button>
                                    </div>
                                </div>
                            </template>
                            
                            <template if:true={merchantAccountFetched}>
                                <div class="slds-p-around_medium slds-m-top_medium">
                                    <template if:true={selectedMerchantAccount}>
                                        <div class="slds-box slds-theme_success slds-m-bottom_medium">
                                            <div class="slds-grid slds-grid_vertical-align-center">
                                                <div class="slds-col slds-size_11-of-12">
                                                    <p class="slds-text-body_regular">
                                                        <strong>Name:</strong> {selectedMerchantAccount.name}
                                                    </p>
                                                    <p class="slds-text-body_regular">  
                                                        <strong>Id:</strong> {selectedMerchantAccount.id}
                                                    </p>
                                                </div>
                                            </div>
                                        </div>
                                        
                                        <p class="slds-m-bottom_medium">
                                            Please verify this is the correct merchant account for your integration and click "Confirm" to save the configuration.
                                        </p>
                                        
                                        <div class="slds-grid slds-grid_align-spread">
                                            <lightning-button 
                                                variant="neutral" 
                                                label="Back" 
                                                onclick={handleBackToChoice}
                                                disabled={isLoading}>
                                            </lightning-button>
                                            <div>
                                                <lightning-button 
                                                    variant="neutral" 
                                                    label="Cancel" 
                                                    onclick={handleCancel} 
                                                    class="slds-m-right_x-small"
                                                    disabled={isLoading}>
                                                </lightning-button>
                                                <lightning-button 
                                                    variant="brand" 
                                                    label="Confirm & Save" 
                                                    onclick={handleConfirmMerchantAccount} 
                                                    disabled={isLoading}>
                                                </lightning-button>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </template>
                            
                            <template if:true={showMerchantAccountSection}>
                                <template if:false={deploymentTimedOut}>
                                    <div class="slds-p-around_medium slds-m-top_medium">
                                        
                                        <lightning-layout class="slds-m-bottom_medium">
                                            <lightning-layout-item padding="horizontal-small">
                                                <h4 class="slds-text-heading_small">Merchant Account</h4>
                                            </lightning-layout-item>
                                        </lightning-layout>
                                        
                                        <lightning-layout vertical-align="center" class="slds-m-bottom_medium">
                                            <lightning-layout-item flexibility="auto" padding="horizontal-small">
                                                <div class="slds-box slds-box_xx-small slds-theme_shade">
                                                    <template if:true={currentMerchantAccount}>
                                                        <p class="slds-text-body_regular">{currentMerchantAccount}</p>
                                                    </template>
                                                    <template if:false={currentMerchantAccount}>
                                                        <p class="slds-text-body_regular slds-text-color_weak">No merchant account configured</p>
                                                    </template>
                                                </div>
                                            </lightning-layout-item>
                                            <lightning-layout-item flexibility="no-grow" padding="horizontal-small">
                                                <lightning-button 
                                                    variant="neutral" 
                                                    label="Refresh" 
                                                    icon-name="utility:refresh"
                                                    icon-position="left"
                                                    onclick={handleFetch} 
                                                    disabled={isLoading}>
                                                </lightning-button>
                                            </lightning-layout-item>
                                        </lightning-layout>
                                        
                                        <lightning-layout>
                                            <lightning-layout-item flexibility="no-grow" padding="horizontal-small">
                                                <lightning-button 
                                                    variant="neutral" 
                                                    label="Back" 
                                                    onclick={handleBackToChoice}
                                                    disabled={isLoading}>
                                                </lightning-button>
                                            </lightning-layout-item>
                                            <lightning-layout-item flexibility="auto" padding="horizontal-small">
                                            </lightning-layout-item>
                                            <template if:true={currentMerchantAccount}>
                                                <lightning-layout-item flexibility="no-grow" padding="horizontal-small">
                                                    <lightning-button 
                                                        variant="brand" 
                                                        label="Continue to Webhook Setup" 
                                                        onclick={handleContinueToWebhook}>
                                                    </lightning-button>
                                                </lightning-layout-item>
                                            </template>
                                        </lightning-layout>
                                    </div>
                                </template>
                            </template>
                        </template>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="slds-col slds-size_1-of-2">
            <div class="slds-box slds-box_x-small slds-is-relative">
                <h2 class="slds-text-heading_medium slds-m-bottom_medium">Instructions</h2>
                
                <div class="slds-box slds-is-relative slds-scrollable" style="min-height: 350px; max-height: 350px;">
                    <div class="slds-p-around_medium">
                        <template if:true={showChoiceInstructions}>
                            <h3 class="slds-text-heading_small slds-m-bottom_small">
                                Configure your Adyen account for webhook setup.
                            </h3>

                            <div class="slds-m-bottom_large">
                                <h4 class="slds-text-body_regular slds-text-title_bold slds-m-bottom_small">Merchant Account Setup</h4>
                                <ul class="slds-list_dotted slds-m-left_medium slds-m-bottom_medium">
                                    <li>Choose this option for merchant-account webhook configuration</li>
                                    <li>Your API key must have access to exactly one merchant account</li>
                                    <li>Webhook events will be received from the selected merchant account</li>
                                </ul>
                            </div>

                            <div class="slds-m-bottom_large">
                                <h4 class="slds-text-body_regular slds-text-title_bold slds-m-bottom_small">Company Account Setup</h4>
                                <ul class="slds-list_dotted slds-m-left_medium slds-m-bottom_medium">
                                    <li>Choose this option to configure webhooks at the company level</li>
                                    <li>Your API key must have access to the company account</li>
                                    <li>Webhook events will be received from all merchant accounts under the company account</li>
                                </ul>
                            </div>
                            
                            <p class="slds-text-color_weak slds-text-body_small">
                                Note: Your choice will determine the scope of webhook events you receive.
                            </p>
                        </template>
                        
                        <template if:true={showMerchantInstructions}>
                            <h3 class="slds-text-heading_small slds-m-bottom_small">
                                Merchant Account Configuration
                            </h3>
                            <p class="slds-m-bottom_medium">
                                Merchant account will be fetched from Adyen using your configured API key.
                            </p>
                            
                            <ol class="slds-list_ordered slds-m-left_medium slds-m-bottom_medium">
                                <li class="slds-m-bottom_small">Click <strong>Refresh</strong> to retrieve your merchant account from Adyen.</li>
                                <li class="slds-m-bottom_small">Verify the merchant account information displayed.</li>
                                <li class="slds-m-bottom_small">Click <strong>Confirm & Save</strong> to update the configuration.</li>
                            </ol>
                            
                            <div class="slds-box slds-box_xx-small slds-theme_warning">
                                <p class="slds-text-body_small">
                                    <strong>Note:</strong> Your API key must have access to exactly one merchant account.
                                </p>
                            </div>
                        </template>
                        
                        <template if:true={showCompanyInstructions}>
                            <h3 class="slds-text-heading_small slds-m-bottom_small">
                                Multi Merchant Account Setup with company level webhook configuration
                            </h3>
                            
                            <ol class="slds-list_ordered slds-m-left_medium slds-m-bottom_medium">
                                <li class="slds-m-bottom_small">In your OMS Org, go to the <strong>App Launcher</strong>, search for <strong>Sales Channels</strong>.</li>
                                <li class="slds-m-bottom_small">Select the <strong>Sales Channel</strong> that you want to configure a merchant account for.</li>
                                <li class="slds-m-bottom_small">Set the <strong>Adyen Merchant Account</strong> field to the name of the merchant account that you want to link to this sales channel.</li>
                                <li class="slds-m-bottom_small">Create an <strong>Adyen_Adapter__mdt</strong> custom metadata record for each sales channel.</li>
                                <li class="slds-m-bottom_small">Ensure that the value in the <strong>Merchant Account</strong> field on custom metadata is the same as the value in the <strong>Adyen Merchant Account</strong> field on the Sales Channel.</li>
                                <li class="slds-m-bottom_small">Fill the <strong>HMAC Key</strong> field with the HMAC generated after the company level webhook setup. You can copy it from the AdyenDefault custom metadata record.</li>
                            </ol>
                            
                        </template>
                    </div>
                </div>
            </div>
        </div>
    </div>
</template>
