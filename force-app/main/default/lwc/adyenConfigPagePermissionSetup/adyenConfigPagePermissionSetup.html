<template>
    <div class="slds-grid slds-gutters">
        <div class="slds-col slds-size_1-of-2">
            <div class="slds-box slds-box_x-small slds-m-bottom_medium slds-is-relative">
                <h2 class="slds-text-heading_medium slds-m-bottom_medium">Set up Record Type & Field Permissions</h2>
                
                <template if:true={showSpinner}>
                    <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
                </template>
                
                <div class="slds-box slds-is-relative" style="min-height: 300px;">
                    <div class="slds-m-bottom_large">
                        <div class="slds-grid slds-grid_align-spread slds-p-vertical_medium">
                            <div class="slds-col slds-size_3-of-5">
                                <lightning-button 
                                    variant="neutral" 
                                    label="Setup Record Type Assignment"
                                    icon-name="utility:user"
                                    icon-position="left"
                                    data-action="recordType"
                                    data-instructiontype="recordType"
                                    onmouseover={handleButtonMouseOver}
                                    onclick={handleNavigateToPermissionSet} 
                                    stretch>
                                </lightning-button>
                            </div>
                        </div>
                    </div>

                    <div class="slds-m-bottom_large">
                        <div class="slds-grid slds-grid_align-spread slds-p-vertical_medium">
                            <div class="slds-col slds-size_3-of-5">
                                <lightning-button 
                                    variant="neutral" 
                                    label="Setup Payment Authorization Fields"
                                    icon-name="utility:user"
                                    icon-position="left"
                                    data-action="paymentAuthorization"
                                    data-instructiontype="paymentAuthorization"
                                    onmouseover={handleButtonMouseOver}
                                    onclick={handleNavigateToPermissionSet} 
                                    stretch>
                                </lightning-button>
                            </div>
                        </div>
                    </div>

                    <div class="slds-m-bottom_large">
                        <div class="slds-grid slds-grid_align-spread slds-p-vertical_medium">
                            <div class="slds-col slds-size_3-of-5">
                                <lightning-button 
                                    variant="neutral" 
                                    label="Setup Payment Fields"
                                    icon-name="utility:user"
                                    icon-position="left"
                                    data-action="payment"
                                    data-instructiontype="payment"
                                    onmouseover={handleButtonMouseOver}
                                    onclick={handleNavigateToPermissionSet} 
                                    stretch>
                                </lightning-button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="slds-col slds-size_1-of-2">
            <div class="slds-box slds-box_x-small slds-is-relative">
                <h2 class="slds-text-heading_medium slds-m-bottom_medium">Instructions</h2>
                
                <div class="slds-box slds-is-relative slds-scrollable" style="min-height: 300px; max-height: 300px;">
                    <template if:true={showDefaultInstructions}>
                        <div class="slds-p-around_medium">
                            <h3 class="slds-text-heading_small slds-m-bottom_small">
                                Configure record type and field permissions for Adyen OMS package.
                            </h3>
                            <ol class="slds-list_dotted slds-m-left_medium">
                                <li>Hover over each button to view step-by-step instructions.</li>
                                <li>Click a button to open the relevant Permission Set setup page.</li>
                            </ol>
                        </div>
                    </template>
                    
                    <template if:true={showRecordTypeInstructions}>
                        <div class="slds-p-around_medium">
                            <h3 class="slds-text-heading_small slds-m-bottom_small">Setup Record Type Assignment</h3>
                            <ol class="slds-list_ordered slds-m-left_medium">
                                <li>Click on <strong>Object Settings</strong>.</li>
                                <li>Find and click on the <strong>Alternative Payment Methods</strong> and click on Edit.</li>
                                <li>Under the Record Type Assignments section, make sure to check the checkbox against <strong>Alternative Payment Method</strong>.</li>
                                <li>Click Save.</li>
                            </ol>
                        </div>
                    </template>
                    
                    <template if:true={showPaymentAuthorizationInstructions}>
                        <div class="slds-p-around_medium">
                            <h3 class="slds-text-heading_small slds-m-bottom_small">Setup Payment Authorization Field Permissions</h3>
                            <ol class="slds-list_ordered slds-m-left_medium">
                                <li>Click on <strong>Object Settings</strong>.</li>
                                <li>Find and click on the <strong>Payment Authorizations</strong> and click on Edit.</li>
                                <li>Navigate to the <strong>Field Permissions</strong> section for Payment Authorization object.</li>
                                <li>Enable <strong>Edit Access</strong> for the <strong>Adyen Payment Method</strong> field.</li>
                                <li>Enable <strong>Edit Access</strong> for the <strong>Adyen Payment Method Variant</strong> field.</li>
                                <li>Click Save.</li>
                            </ol>
                            <div class="slds-m-top_medium slds-p-around_small slds-theme_shade">
                                <p class="slds-text-body_small">
                                    <strong>Note:</strong> These fields provide visibility into payment authorization details and payment method information.
                                </p>
                            </div>
                        </div>
                    </template>
                    
                    <template if:true={showPaymentInstructions}>
                        <div class="slds-p-around_medium">
                            <h3 class="slds-text-heading_small slds-m-bottom_small">Setup Payment Field Permissions</h3>
                            <ol class="slds-list_ordered slds-m-left_medium">
                                <li>Click on <strong>Object Settings</strong>.</li>
                                <li>Find and click on the <strong>Payments</strong> and click on Edit.</li>
                                <li>Navigate to the <strong>Field Permissions</strong> section for Payment object.</li>
                                <li>Enable <strong>Edit Access</strong> for the <strong>Adyen Payment Method</strong> field.</li>
                                <li>Enable <strong>Edit Access</strong> for the <strong>Adyen Payment Method Variant</strong> field.</li>
                                <li>Click Save.</li>
                            </ol>
                            <div class="slds-m-top_medium slds-p-around_small slds-theme_shade">
                                <p class="slds-text-body_small">
                                    <strong>Note:</strong> These fields provide visibility into payment details and are essential for order management workflows.
                                </p>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </div>
    </div>
</template>
