<template>
    <div class="slds-grid slds-gutters">
        <div class="slds-col slds-size_1-of-2">
            <div class="slds-box slds-box_x-small slds-m-bottom_medium slds-is-relative">
                <h2 class="slds-text-heading_medium slds-m-bottom_medium">Set up Credentials</h2>
        
                <template if:true={showSpinner}>
                    <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
                </template>
                
                <div class="slds-box slds-is-relative" style="min-height: 300px;">
                    <div class="slds-m-bottom_large">
                        <div class="slds-media slds-media_center slds-p-bottom_medium slds-border_bottom">
                            <div class="slds-media__figure">
                                <span class="slds-icon_container slds-icon-standard-account">
                                    <lightning-icon icon-name="standard:apex" size="small"></lightning-icon>
                                </span>
                            </div>
                            <div class="slds-media__body">
                                <div class="slds-text-heading_small slds-text-title_bold">AdyenCheckout</div>
                            </div>
                        </div>
                        
                        <div class="slds-p-top_medium">
                            <div class="slds-grid slds-grid_align-spread slds-p-bottom_medium">
                                <div class="slds-col slds-size_1-of-2">
                                    <lightning-button 
                                        variant="neutral" 
                                        label="Update API Key" 
                                        icon-name="utility:key"
                                        icon-position="left"
                                        data-credential="AdyenCheckout"
                                        data-buttontype="apiKey"
                                        onmouseover={handleButtonMouseOver}
                                        onclick={handleUpdateApiKey} 
                                        class="slds-button_stretch">
                                    </lightning-button>
                                </div>
                                <div class="slds-col slds-size_1-of-2 slds-p-left_medium">
                                    <lightning-button 
                                        variant="neutral" 
                                        label="Assign Permissions" 
                                        icon-name="utility:user"
                                        icon-position="left"
                                        data-credential="AdyenCheckout"
                                        data-buttontype="permissions"
                                        onmouseover={handleButtonMouseOver}
                                        onclick={handleAssignPermissions} 
                                        class="slds-button_stretch">
                                    </lightning-button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="slds-m-bottom_medium">
                        <div class="slds-media slds-media_center slds-p-bottom_medium slds-border_bottom">
                            <div class="slds-media__figure">
                                <span class="slds-icon_container slds-icon-standard-account">
                                    <lightning-icon icon-name="standard:apex_plugin" size="small"></lightning-icon>
                                </span>
                            </div>
                            <div class="slds-media__body">
                                <div class="slds-text-heading_small slds-text-title_bold">AdyenManagementAPI</div>
                            </div>
                        </div>

                        <div class="slds-p-top_medium">
                            <div class="slds-grid slds-grid_align-spread slds-p-bottom_medium">
                                <div class="slds-col slds-size_1-of-2">
                                    <lightning-button 
                                        variant="neutral" 
                                        label="Update API Key" 
                                        icon-name="utility:key"
                                        icon-position="left"
                                        data-credential="AdyenManagementAPI"
                                        data-buttontype="apiKey"
                                        onmouseover={handleButtonMouseOver}
                                        onclick={handleUpdateApiKey} 
                                        class="slds-button_stretch">
                                    </lightning-button>
                                </div>
                                <div class="slds-col slds-size_1-of-2 slds-p-left_medium">
                                    <lightning-button 
                                        variant="neutral" 
                                        label="Assign Permissions" 
                                        icon-name="utility:user"
                                        icon-position="left"
                                        data-credential="AdyenManagementAPI"
                                        data-buttontype="permissions"
                                        onmouseover={handleButtonMouseOver}
                                        onclick={handleAssignPermissions} 
                                        class="slds-button_stretch">
                                    </lightning-button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="slds-col slds-size_1-of-2">
            <div class="slds-box slds-box_x-small slds-is-relative">
                <h2 class="slds-text-heading_medium slds-m-bottom_medium">Instructions</h2>
                
                <div class="slds-box slds-is-relative" style="min-height: 300px;">
                    <template if:true={showDefaultInstructions}>
                        <div class="slds-p-around_medium">
                            <h3 class="slds-text-heading_small slds-m-bottom_small">
                                Set up Named Credentials using your Adyen API key.
                            </h3>
                            <ol class="slds-list_dotted slds-m-left_medium">
                                <li>Hover over each button to view step-by-step instructions.</li>
                                <li>Click a button to open the relevant Salesforce Setup page.</li>
                            </ol>
                        </div>
                    </template>
                    
                    <template if:true={showApiKeyInstructions}>
                        <div class="slds-p-around_medium">
                            <h3 class="slds-text-heading_small slds-m-bottom_small">Set up API Key for {currentCredential}</h3>
                            <ol class="slds-list_ordered slds-m-left_medium">
                                <li>On the {currentCredential} NamedCredential page, under <strong>External Credential</strong>, select Adyen API.</li>
                                <li>Under Principals, next to the <strong>AdyenParameterKey</strong>, select the Actions button, and then select Edit.
                                    <div class="slds-p-around_xx-small">This opens a modal window.</div>
                                </li>
                                <li>Select Add, and add an authentication parameter with the following properties:
                                    <ul class="slds-list_dotted slds-m-left_medium slds-m-top_xx-small">
                                        <li>Name: ApiKey</li>
                                        <li>Value: Your API key</li>
                                    </ul>
                                </li>
                                <li>Click <strong>Save</strong>.</li>
                            </ol>
                        </div>
                    </template>
                    
                    <template if:true={showPermissionsInstructions}>
                        <div class="slds-p-around_medium slds-text-body_regular">
                            <h3 class="slds-text-heading_small slds-m-bottom_small">
                                Assign Permissions for {currentCredential}
                            </h3>
                            <strong>A. Set Up Access to Your Principal Credential</strong>
                            <ol class="slds-list_ordered slds-m-left_medium slds-m-bottom_medium">
                                <li>On the Permission Sets setup page, select <strong>New</strong>.</li>
                                <li>In the Label field, enter a name, and select Save.</li>
                                <li>Select <strong>External Credential Principal Access</strong>.</li>
                                <li>Select Edit and enable the Principal you have set up by moving it from the Available to the Enabled column.</li>
                                <li>Go back to the permission set, and select <strong>Object Settings</strong>.</li>
                                <li>Select <strong>User External Credentials</strong>, and then click Edit.</li>
                                <li>Select the checkbox next to <strong>Read</strong> to give read access.</li>
                            </ol>
                            <strong>B. Assign Permission Set to the User</strong>
                            <template if:true={isManagementAPI}>
                                <ol class="slds-list_ordered slds-m-left_medium">
                                    <li>Assign the permission set you have created to the user who is configuring the package.</li>
                                    <li>Select <strong>Manage Assignments</strong>, then select <strong>Add Assignment</strong>.</li>
                                    <li>In the user list, select the appropriate user, and click <strong>Next</strong>.</li>
                                    <li>Use the <strong>All Users</strong> list view if the user is not immediately visible.</li>
                                    <li>Select <strong>Assign</strong>.</li>
                                </ol>
                            </template>
                            <template if:false={isManagementAPI}>
                                <ol class="slds-list_ordered slds-m-left_medium">
                                    <li>Assign the permission set you have created to the <strong>Automated Process</strong> user.</li>
                                    <li>Select <strong>Manage Assignments</strong>, then select <strong>Add Assignment</strong>.</li>
                                    <li>In the user list, select the <strong>Automated Process</strong> user, and click <strong>Next</strong>.</li>
                                    <li>If the user is not visible, switch to the <strong>All Users</strong> list view and search for <strong>auto</strong>.</li>
                                    <li>Select <strong>Assign</strong>.</li>
                                </ol>
                            </template>
                        </div>
                    </template> 
                </div>
            </div>
        </div>
    </div>
</template>
